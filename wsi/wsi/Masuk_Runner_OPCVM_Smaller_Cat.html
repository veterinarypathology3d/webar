const W=960,H=420,ground=340;
let state='ready',score=0,best=Number(localStorage.getItem('catRunnerBest')||0),speed=6,frame=0,obstacles=[],particles=[],cat={x:92,y:ground-88,w:125,h:88,vy:0};
function reset(){state='ready';score=0;speed=6;frame=0;obstacles=[];particles=[];cat.y=ground-cat.h;cat.vy=0;draw()}
function jump(){if(state==='over'){reset();state='playing'}else if(state==='ready')state='playing';if(cat.y>=ground-cat.h-1){cat.vy=-16.5;for(let i=0;i<7;i++)particles.push({x:cat.x+54,y:ground,vx:(Math.random()-.5)*6,vy:-Math.random()*4,life:20})}}
function spawn(){const tall=Math.random()>.55;let h=tall?67:48;obstacles.push({x:W+20,y:ground-h,w:tall?49:62,h})}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawCucumber(o){
 ctx.save();ctx.translate(o.x,o.y);
 // OPCVM is printed directly on every obstacle.
 ctx.fillStyle='#245f43';rounded(-9,0,o.w+18,o.h,9);ctx.fill();
 ctx.fillStyle='#ebf5df';rounded(-5,5,o.w+10,o.h-10,6);ctx.fill();
 ctx.strokeStyle='#245f43';ctx.lineWidth=3;ctx.stroke();
 ctx.fillStyle='#174c34';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.font='900 10px Arial, sans-serif';
 ctx.save();ctx.translate(o.w/2,o.h/2);ctx.rotate(-Math.PI/2);ctx.fillText('OPCVM',0,0);ctx.restore();
 ctx.restore();
}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff8e9';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#ffdfac';ctx.beginPath();ctx.arc(795,83,38,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e9d9bd';for(let i=0;i<6;i++){let x=((i*205-frame*speed*.17)%1130+1130)%1130-100;ctx.beginPath();ctx.ellipse(x,125+(i%3)*29,46,10,0,0,Math.PI*2);ctx.fill()}
ctx.strokeStyle='#45413b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,ground);ctx.lineTo(W,ground);ctx.stroke();ctx.fillStyle='#dec6a1';for(let i=0;i<25;i++){let x=((i*67-frame*speed)%1050+1050)%1050;ctx.fillRect(x,365+(i%3)*10,16,3)}
// Repeat OPCVM at regular intervals on the ground, scrolling with the track.
ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 10px Arial, sans-serif';ctx.fillStyle='#746a5d';
for(let i=0;i<12;i++){const x=((i*120-frame*speed)%1440+1440)%1440-120;if(x>=-40&&x<=W+40)ctx.fillText('OPCVM',x,394)}ctx.restore();
obstacles.forEach(drawCucumber);
ctx.fillStyle='#282828';ctx.font='bold 23px system-ui';ctx.textAlign='left';ctx.fillText('SCORE: '+Math.floor(score),25,37);ctx.font='18px system-ui';ctx.fillText('BEST: '+best,25,64);
particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/20);ctx.fillStyle='#aaa08b';ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
if(image.complete&&image.naturalWidth){ctx.drawImage(image,cat.x,cat.y,cat.w,cat.h)}else{ctx.font='100px serif';ctx.fillText('🐈‍⬛',cat.x,cat.y+cat.h)}
if(state!=='playing'){ctx.fillStyle='rgba(255,248,233,.83)';ctx.fillRect(225,116,520,158);ctx.textAlign='center';ctx.fillStyle='#262626';ctx.font='bold 36px system-ui';ctx.fillText(state==='over'?'GAME OVER!':'CAT READY! 🐾',W/2,170);ctx.font='21px system-ui';ctx.fillText(state==='over'?'Press SPACE or tap to try again':'Press SPACE or tap to start',W/2,212);if(state==='over'){ctx.font='bold 22px system-ui';ctx.fillText('Your score: '+Math.floor(score),W/2,246)}}}
let last=0;function loop(t){const dt=Math.min((t-last)/16.667||1,2);last=t;if(state==='playing'){frame+=dt;score+=dt*.16;speed=Math.min(13,6+score/65);cat.vy+=.82*dt;cat.y+=cat.vy*dt;if(cat.y>ground-cat.h){cat.y=ground-cat.h;cat.vy=0}if(obstacles.length===0||obstacles[obstacles.length-1].x<W-(245+Math.random()*5)){if(Math.random()<.014*dt)spawn()}for(const o of obstacles){o.x-=speed*dt;let cx=cat.x+27,cy=cat.y+22,cw=cat.w-49,ch=cat.h-30;if(cx<o.x+o.w-6&&cx+cw>o.x+7&&cy<o.y+o.h-5&&cy+ch>o.y+7){state='over';best=Math.max(best,Math.floor(score));localStorage.setItem('catRunnerBest',best)}}obstacles=obstacles.filter(o=>o.x+o.w>-30);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0)}draw();requestAnimationFrame(loop)}
document.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)jump()}});canvas.addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.getElementById('jump').addEventListener('click',jump);document.getElementById('restart').addEventListener('click',()=>{reset();state='playing'});image.onload=draw;reset();requestAnimationFrame(loop);
</script></body></html>
